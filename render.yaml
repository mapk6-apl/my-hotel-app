databases:
  - name: breakaway-hotels-db
    databaseName: breakaway_hotels
    user: breakaway_app
    plan: basic-256mb

services:
  - type: web
    name: breakaway-hotels-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:server
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: breakaway-hotels-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PAYFAST_MODE
        value: sandbox
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false
      - key: PAYFAST_SOURCE_IPS
        sync: false
